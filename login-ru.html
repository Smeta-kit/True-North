<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register — True North Travels</title>
	<link rel="stylesheet" href="register.css">
	<link rel="icon" href="img/favicon.ico" type="image/x-icon">
	<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" type="text/css" href="login.css">
</head>

<body>

<header>
		<img src="img/True-North.png" alt="NorwayBack">
			<nav>
				<a href="index-ru.html">Домой</a>
				<a href="program-ru.html">Программа</a>
				<a href="login-ru.html">Руc</a>
				<a href="login-en.html">Англ</a>
			</nav>	
</header>

<div class="reg-container">

	<h1>Создать аккаунт</h1>
	<p class="reg-subtitle">Присоединяйтесь к True North Travels и откройте настоящую Скандинавию</p>

	<form class="reg-form">

		<label>Электронная почта</label>
		<input type="email" placeholder="your@email.com" required>

		<label>Пароль</label>
		<input type="password" placeholder="Создайте пароль" required>

		<label>Подтвердите пароль</label>
		<input type="password" placeholder="Повторите пароль" required>

		<button type="submit" class="reg-btn">Зарегистрироваться</button>

		<p class="reg-alt">Уже есть аккаунт?  
			<a href="signin-ru.html">Войти</a>
		</p>

	</form>
</div>

</body>
</html>
