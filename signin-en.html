<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In — True North Travels</title>
  <link rel="stylesheet" href="signin.css">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>

<header>
		<img src="img/True-North.png" alt="NorwayBack">
			<nav>
				<a href="index-en.html">Home</a>
				<a href="program-en.html">Programs</a>
				<a href="signin-ru.html">Ru</a>
				<a href="signin-en.html">En</a>
			</nav>
</header>

<main class="reg-container">
  <h1>Sign In</h1>
  <p class="reg-subtitle">Welcome back — log in to continue planning your journey</p>

  <form id="signinForm" class="reg-form" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@email.com" required>

    <label for="password">Password</label>
    <div class="password-row">
      <input id="password" name="password" type="password" placeholder="Enter your password" required>
      <button type="button" id="togglePwd" aria-label="Show password">Show</button>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" name="remember"> Remember me
      </label>
      <a class="forgot" href="forgot.html">Forgot password?</a>
    </div>

    <div class="form-error" id="err" aria-live="polite"></div>

    <button type="submit" class="reg-btn">Sign In</button>

    <p class="reg-alt">Don't have an account?  
      <a href="login-en.html">Create one</a>
    </p>
  </form>
</main>

<script>
  // Show/hide password
  const toggle = document.getElementById('togglePwd');
  const pwd = document.getElementById('password');
  toggle.addEventListener('click', () => {
    if (pwd.type === 'password') {
      pwd.type = 'text';
      toggle.textContent = 'Hide';
    } else {
      pwd.type = 'password';
      toggle.textContent = 'Show';
    }
  });

  // Simple validation mock
  const form = document.getElementById('signinForm');
  const err = document.getElementById('err');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.textContent = '';
    const email = form.email.value.trim();
    const password = form.password.value;

    const messages = [];
    if (!email) messages.push('Please enter your email.');
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) messages.push('Please enter a valid email.');
    if (!password) messages.push('Please enter your password.');

    if (messages.length) {
      err.textContent = messages.join(' ');
      return;
    }

    // Fake login
    err.style.color = 'green';
    err.textContent = 'Success! Logging in...';
    setTimeout(() => {
      window.location.href = 'index-en.html';
    }, 900);
  });
</script>

</body>
</html>
