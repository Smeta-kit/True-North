<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register — True North Travels</title>
	<link rel="stylesheet" href="register.css">
	<link rel="icon" href="img/favicon.ico" type="image/x-icon">
	<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" type="text/css" href="login.css">
</head>

<body>

<header>
		<img src="img/True-North.png" alt="NorwayBack">
			<nav>
				<a href="index-en.html">Home</a>
				<a href="program-en.html">Programs</a>
				<a href="login-ru.html">Ru</a>
				<a href="login-en.html">En</a>
			</nav>
</header>

<div class="reg-container">

	<h1>Create your account</h1>
	<p class="reg-subtitle">Join True North Travels and explore the real Scandinavia</p>

	<form class="reg-form">

		<label>Email</label>
		<input type="email" placeholder="your@email.com" required>

		<label>Password</label>
		<input type="password" placeholder="Create a password" required>

		<label>Confirm Password</label>
		<input type="password" placeholder="Repeat password" required>

		<button type="submit" class="reg-btn">Sign Up</button>

		<p class="reg-alt">Already have an account?  
			<a href="signin-en.html">Sign in</a>
		</p>

	</form>
</div>

</body>
</html>
